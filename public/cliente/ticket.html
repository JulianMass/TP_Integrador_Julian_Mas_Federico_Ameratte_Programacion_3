<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPoint | Ticket de compra</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="stylesheet" href="css/ticket.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Logo de TechPoint">
        </div>

        <p class="integrantes">
            Integrantes: Julián Mas y Federico Ameratte
        </p>

        <nav>
            <a href="catalogo.html">Productos</a>
            <a href="carrito.html">Mi carrito</a>

            <button id="btnTema" class="btn-tema" type="button">
                🌙 Tema oscuro
            </button>
        </nav>
    </header>

    <main>

        <section class="ticket">

            <div class="ticket-encabezado">
                <h2>¡Gracias por tu compra!</h2>
                <p>TechPoint - Tecnología y accesorios</p>
                <p>Comprobante de compra</p>
            </div>

            <div class="datos-cliente">
                <p>Cliente: <span id="nombreTicket"></span></p>
                <p>Fecha: <span id="fechaTicket"></span></p>
                <p>Número de venta: <span id="numeroVenta"></span></p>
            </div>

            <div class="detalle-ticket">

                <h3>Detalle de la compra</h3>

                <div id="productosTicket">
                    <p>Cargando ticket...</p>
                </div>

            </div>

            <div class="total-ticket">
                <h3>Total: <span id="totalTicket">$0</span></h3>
            </div>

            <div class="acciones-ticket">
                <button id="btnDescargarPDF">
                    Descargar ticket PDF
                </button>

                <button id="btnSalir">
                    Finalizar y volver al inicio
                </button>
            </div>

        </section>

    </main>

    <footer>
        <p>TechPoint - Tecnología y accesorios</p>
    </footer>

    <script src="js/tema.js"></script>
    <script src="js/ticket.js"></script>

</body>
</html>
