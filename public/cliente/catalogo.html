<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPoint | Productos</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/catalogo.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Logo de TechPoint">
        </div>

        <p class="integrantes">
            Integrantes: Julián Mas y Federico Ameratte
        </p>

        <nav>
            <a href="catalogo.html"> Productos </a>
            <a href="carrito.html"> Mi carrito </a>
            <a href="/admin/login.html"> Administración </a>

            <button id="btnTema" class="btn-tema" type="button">
                🌙 Tema oscuro
            </button>
        </nav>
    </header>

    <main>

        <section class="bienvenida">
            <h2> ¡Hola, <span id="nombreCliente"></span>!</h2>
            <p> Elegí los productos que quieras comprar. </p>
        </section>

        <section class="catalogo">

            <h2> Nuestros productos </h2>

            <div class="categorias">
                <button class="btn-categoria activo" data-categoria="todos">
                    Todos
                </button>

                <button class="btn-categoria" data-categoria="perifericos">
                    Periféricos
                </button>

                <button class="btn-categoria" data-categoria="accesorios">
                    Accesorios
                </button>
            </div>

            <div id="contenedorProductos" class="productos">
                <p> Cargando productos... </p>
            </div>

            <div class="paginacion">
                <button id="btnAnterior" disabled> Anterior </button>
                <span id="paginaActual"> Página 1 </span>
                <button id="btnSiguiente"> Siguiente </button>
            </div>

        </section>

    </main>

    <footer>
        <p> TechPoint - Tecnología y accesorios </p>
    </footer>

    <script src="js/tema.js"></script>
    <script src="js/catalogo.js"></script>

</body>
</html>
